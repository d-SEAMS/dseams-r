url: https://r.dseams.info/
template:
  bootstrap: 5
  light-switch: true
  includes:
    in_header: |
      <link rel="stylesheet" href="/dseams/dseams-tokens.css">
      <link rel="stylesheet" href="/dseams/dseams-family.css">
      <link rel="stylesheet" href="/dseams/dseams-pkgdown.css">
    before_body: |
      <nav class="dseams-family" aria-label="d-SEAMS">
        <a class="dseams-family__brand" href="https://dseams.info/">d-SEAMS</a>
        <ul class="dseams-family__nav">
          <li class="dseams-family__anchor"><a href="https://dseams.info/#install">Install</a></li>
          <li class="dseams-family__anchor"><a href="https://dseams.info/#output">Output</a></li>
          <li class="dseams-family__anchor"><a href="https://dseams.info/#science">Methods</a></li>
          <li class="dseams-family__docs">
            <details>
              <summary>Docs</summary>
              <div class="dseams-family__menu">
                <a href="https://docs.dseams.info/">Engine &amp; CLI</a>
                <a href="https://python.dseams.info/">Python</a>
                <a href="https://rust.dseams.info/">Rust</a>
                <a href="https://julia.dseams.info/">Julia</a>
                <a href="https://r.dseams.info/" aria-current="page">R</a>
                <a href="https://lua.dseams.info/">Lua / Fennel</a>
                <a href="https://fortran.dseams.info/">Fortran</a>
                <a href="https://plumed.dseams.info/">PLUMED</a>
                <a href="https://linkcell.dseams.info/">linkcell</a>
              </div>
            </details>
          </li>
          <li><a href="https://wiki.dseams.info/">Wiki</a></li>
          <li class="dseams-family__anchor"><a href="https://dseams.info/#cite">Cite</a></li>
          <li><a href="https://github.com/d-SEAMS">GitHub</a></li>
        </ul>
      </nav>
  bslib:
    primary: "#0e4da4"
    link-color: "#0e4da4"
    font-size-base: 1rem
    border-radius: 10px
    code-color: "#0b3a7a"
    base_font: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
    code_font: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace"
    heading_font: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
destination: _site
repo:
  branch: main
  url:
    home: https://github.com/d-SEAMS/dseams-r/
    source: https://github.com/d-SEAMS/dseams-r/blob/main/
    issue: https://github.com/d-SEAMS/dseams-r/issues/
    user: https://github.com/

reference:
  - title: Frames
    desc: A frame is an external pointer. The finalizer frees it.
    contents:
      - dseams_example
      - read_frame
      - nframes
      - positions
      - print.dseams_frame
      - summary.dseams_frame
  - title: Ice and order
    desc: Results are data frames. print and summary dispatch on the class.
    contents:
      - chill_plus
      - cages
      - primitive_rings
      - signature_cages
      - symmetry
      - steinhardt
      - q4_q6
      - jump_tau90
  - title: C API
    desc: One system handle, then an analysis. Errors are stop() with the handle text.
    contents:
      - starts_with("seams_")
  - title: Print and summary
    desc: S3 methods for frames and for each result class.
    contents:
      - starts_with("print.")
      - starts_with("summary.")
  - title: Engine
    desc: Threads and the bundled engine version.
    contents:
      - dseams_threads
      - dseams_version
