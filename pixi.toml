[workspace]
name = "dseams-r"
version = "2.14.1"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# An R toolchain with every package that R CMD check --as-cran asks for.
# The engine itself is compiled by R from src/seams.
[dependencies]
r-base = ">=4.4,<4.6"
compilers = ">=1.9.0,<2"
make = "*"
pkg-config = "*"
pandoc = "*"
r-cpp11 = ">=0.4"
r-rcppeigen = ">=0.3"
r-testthat = ">=3.0.0"
r-knitr = ">=1.45"
r-rmarkdown = ">=2.25"
r-covr = "*"
qpdf = "*"
ca-certificates = "*"

[tasks]
# SEAMS_CORE_SRC, when set, is copied instead of downloading the pin.
vendor = "sh tools/vendor.sh"
build = "R CMD build ."
# R CMD check --as-cran reports a WARNING when checkbashisms is not on
# PATH (Debian/Ubuntu devscripts, Homebrew checkbashisms); conda-forge has
# no package for it. This task fails first instead.
require-checkbashisms = "checkbashisms --version"
# conda-forge's R adds -march=nocona to every compile; that flag is the
# toolchain's, not the package's.
check = { cmd = "R CMD check --as-cran --no-manual dseams_2.14.1.tar.gz", env = { _R_CHECK_COMPILATION_FLAGS_KNOWN_ = "-march=nocona" }, depends-on = ["require-checkbashisms"] }
