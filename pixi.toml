[workspace]
name = "dseams-r"
version = "2.14.1"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

# An R toolchain with every package that R CMD check --as-cran asks for.
# The engine itself is compiled by R from src/seams.
[dependencies]
r-base = ">=4.4,<4.6"
compilers = ">=1.9.0,<2"
make = "*"
pkg-config = "*"
pandoc = "*"
r-cpp11 = ">=0.4"
r-rcppeigen = ">=0.3"
r-testthat = ">=3.0.0"
r-knitr = ">=1.45"
r-rmarkdown = ">=2.25"
r-covr = "*"
qpdf = "*"
ca-certificates = "*"
r-roxygen2 = ">=7.3"

[feature.readers.dependencies]
# Optional trajectory readers. The default environment leaves them out,
# which is the CRAN build. readcon-core is not on conda-forge; the
# readers environment supplies Rust and cargo-c so tools/install-readcon.sh
# can install the upstream v0.16.2 the engine links.
chemfiles = ">=0.10.4,<0.11"
rust = ">=1.88,<2"
cargo-c = ">=0.10"

[environments]
default = { features = [] }
readers = { features = ["readers"] }

[tasks]
# SEAMS_CORE_SRC, when set, is copied instead of downloading the pin.
vendor = "sh tools/vendor.sh"
build = "R CMD build ."
# conda-forge's R adds -march=nocona to every compile; that flag is the
# toolchain's, not the package's.
check = { cmd = "R CMD check --as-cran --no-manual dseams_2.14.1.tar.gz", env = { _R_CHECK_COMPILATION_FLAGS_KNOWN_ = "-march=nocona" } }
