url: https://r.dseams.info/
template:
  bootstrap: 5
  light-switch: true
  includes:
    in_header: |
      <link rel="stylesheet" href="/dseams/dseams-tokens.css">
      <link rel="stylesheet" href="/dseams/dseams-family.css">
      <link rel="stylesheet" href="/dseams/dseams-pkgdown.css">
    before_body: |
      <nav class="dseams-family" aria-label="d-SEAMS">
        <a class="dseams-family__brand" href="https://dseams.info/">d-SEAMS</a>
        <ul class="dseams-family__nav">
          <li class="dseams-family__anchor"><a href="https://dseams.info/#install">Install</a></li>
          <li class="dseams-family__anchor"><a href="https://dseams.info/#output">Output</a></li>
          <li class="dseams-family__anchor"><a href="https://dseams.info/#science">Methods</a></li>
          <li class="dseams-family__docs">
            <details>
              <summary>Docs</summary>
              <div class="dseams-family__menu">
                <a href="https://docs.dseams.info/">Engine &amp; CLI</a>
                <a href="https://python.dseams.info/">Python</a>
                <a href="https://rust.dseams.info/">Rust</a>
                <a href="https://julia.dseams.info/">Julia</a>
                <a href="https://r.dseams.info/" aria-current="page">R</a>
                <a href="https://lua.dseams.info/">Lua / Fennel</a>
                <a href="https://fortran.dseams.info/">Fortran</a>
                <a href="https://plumed.dseams.info/">PLUMED</a>
                <a href="https://linkcell.dseams.info/">linkcell</a>
              </div>
            </details>
          </li>
          <li><a href="https://wiki.dseams.info/">Wiki</a></li>
          <li class="dseams-family__anchor"><a href="https://dseams.info/#cite">Cite</a></li>
          <li><a href="https://github.com/d-SEAMS">GitHub</a></li>
        </ul>
      </nav>
  bslib:
    primary: "#0e4da4"
    link-color: "#0e4da4"
    font-size-base: 1rem
    border-radius: 10px
    code-color: "#0b3a7a"
    base_font: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
    code_font: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace"
    heading_font: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
destination: _site
navbar:
  structure:
    left: [intro, reference, articles, tutorials, news, srr]
    right: [search, github, lightswitch]
  components:
    srr:
      text: rOpenSci standards
      href: srr-standards.html
repo:
  branch: main
  url:
    home: https://github.com/d-SEAMS/dseams-r/
    source: https://github.com/d-SEAMS/dseams-r/blob/main/
    issue: https://github.com/d-SEAMS/dseams-r/issues/
    user: https://github.com/

redirects:
  - ["reference/print.dseams_ice.html", "reference/chill_plus.html"]
  - ["reference/summary.dseams_ice.html", "reference/chill_plus.html"]
  - ["reference/print.dseams_cages.html", "reference/cages.html"]
  - ["reference/summary.dseams_cages.html", "reference/cages.html"]
  - ["reference/print.dseams_rings.html", "reference/primitive_rings.html"]
  - ["reference/summary.dseams_rings.html", "reference/primitive_rings.html"]
  - ["reference/print.dseams_steinhardt.html", "reference/steinhardt.html"]
  - ["reference/summary.dseams_steinhardt.html", "reference/steinhardt.html"]
  - ["reference/print.dseams_q4_q6.html", "reference/q4_q6.html"]
  - ["reference/summary.dseams_q4_q6.html", "reference/q4_q6.html"]
  - ["reference/print.dseams_system.html", "reference/seams_system_new.html"]
  - ["reference/summary.dseams_system.html", "reference/seams_system_new.html"]
  - ["reference/print.dseams_chill.html", "reference/seams_chill.html"]
  - ["reference/summary.dseams_chill.html", "reference/seams_chill.html"]
  - ["reference/summary.dseams_frame.html", "reference/read_frame.html"]

reference:
  - title: Read a frame
    desc: One configuration from a LAMMPS dump or an XYZ file.
    contents:
      - dseams
      - dseams_example
      - read_frame
      - nframes
      - positions
  - title: Ice, rings, cages, and order
    desc: Data frames and vectors. print() counts labels. The rows stay in the data frame.
    contents:
      - chill_plus
      - cages
      - primitive_rings
      - signature_cages
      - symmetry
      - steinhardt
      - q4_q6
      - jump_tau90
  - title: System handle
    desc: One handle from seams_system_new(), then an analysis of the frame loaded into it.
    contents:
      - starts_with("seams_")
  - title: Threads and version
    desc: The OpenMP width, and the engine version this package was built with.
    contents:
      - dseams_threads
      - dseams_version
