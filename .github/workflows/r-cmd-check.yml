name: R-CMD-check
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # tools/seams-core.ref is the one place the engine revision is written.
  pin:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.pin.outputs.SEAMS_CORE_REPO }}
      ref: ${{ steps.pin.outputs.SEAMS_CORE_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        run: grep -E '^SEAMS_CORE_(REPO|REF)=' tools/seams-core.ref >> "$GITHUB_OUTPUT"

  # The source package with the engine copied in, as CRAN builds it.
  bundled:
    name: bundled ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    needs: pin
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: devel }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: true
      # The tests that read input/traj beyond the shipped examples.
      DSEAMS_ROOT: ${{ github.workspace }}/seams-core
      # A test that needs a pinned input fails instead of skipping, and
      # tools/check-test-inputs.R reads this log after the check.
      DSEAMS_REQUIRE_DATA: "1"
      DSEAMS_INPUTS_LOG: ${{ github.workspace }}/dseams-inputs.log
    steps:
      # The package and seams-core are checked out side by side, so that
      # R CMD build does not pick up the seams-core tree as package content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dseams
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.pin.outputs.repo }}
          ref: ${{ needs.pin.outputs.ref }}
          path: seams-core
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      # R CMD check --as-cran runs checkbashisms on configure and cleanup,
      # and qpdf on the PDFs in the package, and reports a WARNING when
      # either is missing. The bundled chemfiles links SQLite3 for its
      # DESRES .dms reader.
      - name: Install checkbashisms, qpdf and SQLite3
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils devscripts qpdf libsqlite3-dev
      - name: Install macOS package-check tools
        if: runner.os == 'macOS'
        run: |
          brew install checkbashisms llvm qpdf
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install the Rust target for Rtools
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      # The archive rewrite is not a testthat test and does not skip.
      # Linux has binutils from the step above. macOS has Homebrew llvm
      # on PATH. A missing objcopy, nm, ar, or compiler fails this step.
      - name: Rewrite a reader archive with objcopy
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dseams
        run: sh tools/check-reader-symbols.sh
      - name: Require objcopy for the reader symbol rewrite
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v objcopy >/dev/null 2>&1 && ! command -v llvm-objcopy >/dev/null 2>&1; then
            echo "objcopy is not on PATH" >&2
            exit 1
          fi
      - name: Submission notes are ASCII
        shell: bash
        working-directory: dseams
        run: |
          Rscript -e 'files <- c("cran-comments.md", "docs/ropensci-submission.md"); bad <- files[!vapply(files, function(f) { b <- readBin(f, "raw", file.info(f)[["size"]]); !any(b > as.raw(127)) }, logical(1))]; if (length(bad)) { message(paste(bad, collapse = "\n")); quit(status = 1) }'
      - name: Copy the engine into the package
        shell: bash
        working-directory: dseams
        run: sh tools/vendor.sh "$DSEAMS_ROOT"
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: dseams
          extra-packages: |
            any::rcmdcheck
            any::brio
            any::cli
            any::decor
            any::desc
            any::glue
            any::tibble
            any::vctrs
          needs: check
      - name: Check cpp11 registration
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        working-directory: dseams
        run: |
          Rscript -e 'cpp11::cpp_register(quiet = FALSE)'
          git diff --exit-code -- R/cpp11.R src/cpp11.cpp
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: dseams
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true
      - name: The cubic-ice test read mW_cubic and did not skip
        shell: bash
        working-directory: dseams
        run: Rscript tools/check-test-inputs.R check/dseams.Rcheck/tests/testthat.Rout "$DSEAMS_INPUTS_LOG"

  # seams-core built at the pin, and the package linked against its
  # libseams and libseams_lang instead of compiling the copy.
  linked:
    name: linked against seams-core (ubuntu)
    needs: pin
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: true
      DSEAMS_ROOT: ${{ github.workspace }}/seams-core
      SEAMS_LIBDIR: ${{ github.workspace }}/seams-core/build/bindings
      SEAMS_BIN: ${{ github.workspace }}/seams-core/build/seams
      SEAMS_CPP_ORACLE: ${{ github.workspace }}/seams-core/build/bindings/binding_oracle
      DSEAMS_REQUIRE_DATA: "1"
      DSEAMS_INPUTS_LOG: ${{ github.workspace }}/dseams-inputs.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dseams
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.pin.outputs.repo }}
          ref: ${{ needs.pin.outputs.ref }}
          path: seams-core
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: seams-core/pixi.toml
          environments: default
          cache-key: pixi-seams-core-
      # Enabled, not auto: setup stops when chemfiles or readcon-core is
      # missing. A chemfiles without all 37 VMD molfile readers fails the
      # seams-core reader probe, so meson builds the patched copy, which
      # registers the same formats as the bundled src/chemfiles.
      - name: Build seams-core
        working-directory: seams-core
        run: |
          pixi run meson setup build -Dwith_chemfiles=enabled -Dwith_readcon=enabled
          pixi run ninja -C build seams src/libseams.so bindings/libseams_lang.so bindings/binding_oracle
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: dseams/pixi.toml
          cache-key: pixi-dseams-
      - name: Install checkbashisms
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils devscripts
      - name: Rewrite a reader archive with objcopy
        working-directory: dseams
        run: pixi run sh tools/check-reader-symbols.sh
      - name: Submission notes are ASCII
        working-directory: dseams
        run: |
          pixi run Rscript -e 'files <- c("cran-comments.md", "docs/ropensci-submission.md"); bad <- files[!vapply(files, function(f) { b <- readBin(f, "raw", file.info(f)[["size"]]); !any(b > as.raw(127)) }, logical(1))]; if (length(bad)) { message(paste(bad, collapse = "\n")); quit(status = 1) }'
      - name: R CMD check
        working-directory: dseams
        run: |
          pixi run sh tools/vendor.sh "$DSEAMS_ROOT"
          pixi run R CMD build --no-manual .
          pixi run R CMD check --no-manual dseams_*.tar.gz
      - name: The cubic-ice test read mW_cubic and did not skip
        working-directory: dseams
        run: pixi run Rscript tools/check-test-inputs.R dseams.Rcheck/tests/testthat.Rout "$DSEAMS_INPUTS_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linked-check
          path: dseams/dseams.Rcheck
