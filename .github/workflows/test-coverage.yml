name: test-coverage
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.pin.outputs.SEAMS_CORE_REPO }}
      ref: ${{ steps.pin.outputs.SEAMS_CORE_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        run: grep -E '^SEAMS_CORE_(REPO|REF)=' tools/seams-core.ref >> "$GITHUB_OUTPUT"

  # covr on the R code. .covrignore leaves out src/, the engine copy and the
  # glue, which seams-core and the oracle test cover. The package links the
  # seams-core build at the pin, so the binding_oracle test runs too.
  coverage:
    needs: pin
    runs-on: ubuntu-latest
    env:
      DSEAMS_ROOT: ${{ github.workspace }}/seams-core
      SEAMS_LIBDIR: ${{ github.workspace }}/seams-core/build/bindings
      SEAMS_BIN: ${{ github.workspace }}/seams-core/build/seams
      SEAMS_CPP_ORACLE: ${{ github.workspace }}/seams-core/build/bindings/binding_oracle
      DSEAMS_REQUIRE_DATA: "1"
      DSEAMS_INPUTS_LOG: ${{ github.workspace }}/dseams-inputs.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dseams
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.pin.outputs.repo }}
          ref: ${{ needs.pin.outputs.ref }}
          path: seams-core
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: seams-core/pixi.toml
          environments: default
          cache-key: pixi-seams-core-
      - name: Build seams-core
        working-directory: seams-core
        run: |
          pixi run meson setup build
          pixi run ninja -C build seams src/libseams.so bindings/libseams_lang.so bindings/binding_oracle
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: dseams/pixi.toml
          cache-key: pixi-dseams-
      - name: Install objcopy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils
      - name: Rewrite a reader archive with objcopy
        working-directory: dseams
        run: pixi run sh tools/check-reader-symbols.sh
      - name: Coverage
        working-directory: dseams
        env:
          COVR_INSTALL: ${{ runner.temp }}/covr
        run: |
          pixi run sh tools/vendor.sh "$DSEAMS_ROOT"
          pixi run Rscript .github/coverage.R
      - name: The cubic-ice test read mW_cubic and did not skip
        working-directory: dseams
        run: pixi run Rscript tools/check-test-inputs.R "$RUNNER_TEMP/covr/dseams/dseams-tests/testthat.Rout" "$DSEAMS_INPUTS_LOG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/covr/coverage.rds
            ${{ runner.temp }}/covr/dseams/dseams-tests/*.Rout*
          if-no-files-found: ignore
